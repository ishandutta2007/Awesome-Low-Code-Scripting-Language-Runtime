<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360" style="background:#0b0f19;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;border-radius:12px;overflow:hidden"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e1a"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".8"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".2"/></linearGradient><linearGradient id="cardBg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".6"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".5" d="M 30 0 L 0 0 0 30"/></pattern></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-10px) translateX(6px)}}@keyframes pingDot{0%{r:3;opacity:1}50%{r:6;opacity:.4}}.pulse-layer{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.data-wire{stroke-dasharray:6,6;animation:dashFlow 2s linear infinite}.floating-pill{animation:floatParticle 5s ease-in-out infinite}.ping-point{animation:pingDot 2.5s ease-in-out infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)"/><rect width="1200" height="360" fill="url(#grid)"/><circle cx="150" cy="80" r="140" fill="url(#accentCyan)" class="pulse-layer" filter="url(#glow)" opacity=".3"/><circle cx="1060" cy="280" r="160" fill="url(#accentPurple)" class="pulse-layer" filter="url(#glow)" opacity=".35"/><g opacity=".4"><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 80 300 Q 250 330 450 300 T 800 320 T 1120 290" class="data-wire"/><path fill="none" stroke="#a855f7" stroke-width="1.5" d="M 120 70 Q 380 40 600 70 T 980 50 T 1100 90" class="data-wire" style="animation-direction:reverse"/></g><g class="floating-pill" opacity=".85"><g transform="translate(80, 220)"><rect width="130" height="30" fill="url(#cardBg)" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="4" fill="#38bdf8" class="ping-point"/><text x="30" y="19" fill="#94a3b8" font-size="11" font-weight="600">TypeScript / JS</text></g><g transform="translate(1000, 70)"><rect width="120" height="30" fill="url(#cardBg)" stroke="#818cf8" stroke-opacity=".5" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="4" fill="#818cf8" class="ping-point"/><text x="30" y="19" fill="#94a3b8" font-size="11" font-weight="600">Python 3.13</text></g><g transform="translate(980, 230)"><rect width="140" height="30" fill="url(#cardBg)" stroke="#c084fc" stroke-opacity=".5" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="4" fill="#c084fc" class="ping-point"/><text x="30" y="19" fill="#94a3b8" font-size="11" font-weight="600">Sandboxed VM</text></g></g><g text-anchor="middle" transform="translate(600, 105)"><rect width="380" height="28" x="-190" y="-34" fill="#1e293b" stroke="#334155" stroke-width="1" rx="14"/><text x="0" y="-16" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">⚡ ENTERPRISE &amp; OPEN-SOURCE ECOSYSTEM</text><text x="0" y="55" fill="url(#primaryGrad)" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.6))" font-size="44" font-weight="800" letter-spacing="-.5">Awesome Low-Code Scripting &amp; Runtime</text><text x="0" y="100" fill="#cbd5e1" font-size="17" font-weight="400">Curated Catalog of Embedded Runtimes, Workflow Scripting Engines &amp; Extensible Execution VMs</text><g><g transform="translate(0, 140) translate(-320, 0)"><rect width="190" height="38" x="0" y="0" fill="#1e293b" fill-opacity=".8" stroke="#3b82f6" stroke-width="1.2" rx="8"/><text x="95" y="23" fill="#f8fafc" font-size="13" font-weight="600">🏢 Enterprise SaaS (10)</text></g><g transform="translate(0, 140) translate(-100, 0)"><rect width="200" height="38" x="0" y="0" fill="#1e293b" fill-opacity=".8" stroke="#10b981" stroke-width="1.2" rx="8"/><text x="100" y="23" fill="#f8fafc" font-size="13" font-weight="600">⭐ Open-Source Engines (14)</text></g><g transform="translate(0, 140) translate(130, 0)"><rect width="200" height="38" x="0" y="0" fill="#1e293b" fill-opacity=".8" stroke="#a855f7" stroke-width="1.2" rx="8"/><text x="100" y="23" fill="#f8fafc" font-size="13" font-weight="600">🔒 Polyglot &amp; Sandboxed</text></g></g></g></svg>